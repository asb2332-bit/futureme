<style>
/* Layout: "letters to the future". Airmail envelopes on a pale blue desk; one screen at a time behind a prototype bar.
   Deliberately single-theme (paper is paper). Element ids match the current app so the CSS ports directly. */
:root {
  color-scheme: light;
  --desk: #e9eef5;        /* page background */
  --paper: #fffefa;       /* envelopes, panels */
  --ink: #1a2133;         /* text, primary buttons */
  --muted: #5d6679;
  --rule: #cfd6e2;
  --red: #c8352b;         /* airmail red, wax seal, sealed state */
  --blue: #1f4bb8;        /* airmail blue, links, unlocked state */
  --wax: #a3221d;
  --ok: #24704a;

  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-type: "Courier Prime", "Courier New", ui-monospace, monospace;

  --airmail: repeating-linear-gradient(-45deg, var(--red) 0 10px, var(--paper) 10px 20px, var(--blue) 20px 30px, var(--paper) 30px 40px);
  --lift: 0 1px 0 rgba(26,33,51,.06), 0 10px 24px -12px rgba(26,33,51,.35);
  --radius: 6px;
}
* { box-sizing: border-box; }
html, body { background: var(--desk); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.type { font-family: var(--f-type); }
.eyebrow { font-family: var(--f-type); font-size: 14px; letter-spacing: .06em; color: var(--muted); }

/* prototype bar (not part of the app) */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #0f1422; }
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: #0f1422; color: #e8ecf5; }
.proto-in { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.proto-in > span { color: #9aa6bf; font-family: var(--f-type); }
.proto nav { display: flex; gap: 4px; flex-wrap: wrap; }
.proto button { background: transparent; border: 1px solid #36405a; color: #e8ecf5; border-radius: 999px; padding: 3px 11px; cursor: pointer; }
.proto button[aria-current="page"] { background: #e8ecf5; color: #0f1422; border-color: #e8ecf5; }

/* shell */
.stripe { height: 8px; background: var(--airmail); }
.app { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 88px; }
.site-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 44px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--f-display); font-size: 24px; }
.logo .mark { width: 30px; height: 30px; border-radius: 50%; background: var(--wax); color: #fff3ec; display: grid; place-items: center; font-size: 14px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.18); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 10px 18px; font-weight: 600; background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none; transition: background .15s ease, color .15s ease; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: #2c3754; }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.btn.quiet { border-color: var(--rule); }
.btn.quiet:hover { border-color: var(--ink); }
.btn.seal { background: var(--red); border-color: var(--red); color: #fff; width: 100%; padding: 12px; font-size: 16px; }
.btn.seal:hover { background: var(--wax); border-color: var(--wax); }
.btn.seal .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--wax); box-shadow: 0 0 0 2px rgba(255,255,255,.55); display: grid; place-items: center; font-family: var(--f-display); font-size: 11px; }

/* postal pieces */
.stamp { padding: 5px; background: radial-gradient(circle at 5px 5px, transparent 2.6px, var(--paper) 3px) -5px -5px / 10px 10px; filter: drop-shadow(0 1px 1px rgba(26,33,51,.25)); flex: none; }
.postmark { width: 92px; height: 92px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; text-align: center; font-family: var(--f-type); font-size: 11px; line-height: 1.15; letter-spacing: .04em; color: var(--muted); transform: rotate(-12deg); position: relative; flex: none; }
.postmark::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1px solid currentColor; opacity: .7; }
.postmark b { display: block; font-size: 17px; letter-spacing: 0; }
.postmark.red { color: var(--red); }
.wax { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8433b, var(--wax) 60%, #7d1714); color: #ffd9cf; display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; box-shadow: 0 0 0 4px rgba(163,34,29,.25), 0 3px 6px rgba(0,0,0,.25); flex: none; }

/* poster (the letter itself) */
.poster { position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden; container-type: inline-size; user-select: none; border-radius: 3px; }
.poster[data-font="serif"] { font-family: Georgia, "Times New Roman", serif; }
.poster[data-font="mono"] { font-family: var(--f-type); }
.poster[data-font="display"] { font-family: var(--f-display); }
.pb { position: absolute; display: grid; place-items: center; text-align: center; overflow: hidden; padding: 1.2cqw; line-height: 1.12; overflow-wrap: anywhere; }
.pb.title { font-weight: 700; font-size: 8cqw; letter-spacing: -.02em; }
.pb.icon { font-size: 9cqw; }

.rts { max-width: 520px; margin: 40px auto; background: var(--paper); border: 1.5px solid var(--rule); box-shadow: var(--lift); padding: 34px 26px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; position: relative; }

}

}

    var h = nav("");
    h += '<a class="back" href="#home">← All capsules</a>';
    h += '<section class="cap-page"><div class="opening" id="capsule-poster">' + posterHTML(c) + '<div class="pocket" aria-hidden="true"><div class="wax">FM</div></div></div>';
    h += '<div class="info"><span class="chip open">' + openSvg + "Unlocked</span><h2>Written " + plural(days, "day") + " ago.</h2>";
    h += '<p style="font-size:18px;color:var(--muted);max-width:34ch">You sealed “' + esc(c.title) + "” on " + fmtDay(c.created_at) + " and it waited until " + fmtDay(c.unlock_at) + ".</p>";
    h += '<dl class="facts"><dt>Sealed</dt><dd>' + fmtDay(c.created_at) + "</dd><dt>Opened</dt><dd>" + fmtDate(c.unlock_at) + "</dd><dt>Inside</dt><dd>" + insideText(c) + '</dd></dl><div class="row"><a class="btn primary" href="#create">Seal another</a></div></div></section>';
    app.innerHTML = h;
    wireAudio(app);
  }
  function renderMissing() {
    app.innerHTML = nav("") + '<section class="rts"><span class="rubber">Return to sender</span><h1>Capsule not found</h1><p>This link doesn\'t match any capsule. Check it for a typo.</p><a class="btn primary" href="#home">Back to all capsules</a></section>';
  }

  /* ---------- router ---------- */
  var navBtns = document.querySelectorAll("#proto-nav [data-go]");
  navBtns.forEach(function (b) { b.onclick = function () { location.hash = b.dataset.go; }; });
  function route() {
    clearTimers();
    stopAudio();
    var r = (location.hash || "#home").slice(1), active = r;
    if (r.indexOf("view-") === 0) {
      var c = capsules.find(function (x) { return "view-" + x.id === r; });
      if (!c) { renderMissing(); active = "missing"; }
      else { current = c; if (isLocked(c)) { renderSealed(c); active = "sealed"; } else { renderOpened(c); active = "opened"; } }
    } else if (r === "empty") renderHome(true);
    else if (r === "create") renderEditor();
    else if (r === "sealed") { if (!isLocked(current)) current = capsules.find(isLocked) || current; renderSealed(current); }
    else if (r === "opened") renderOpened(isLocked(current) ? (capsules.find(function (x) { return !isLocked(x); }) || current) : current);
    else if (r === "missing") renderMissing();
    else { renderHome(false); active = "home"; }
    navBtns.forEach(function (b) { if (b.dataset.go === active) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>

</body>
</html>
