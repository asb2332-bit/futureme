<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutureMe Capsule</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/capsule.js" defer></script>
</head>
<body>
  <main>
    <a class="back" href="/">← All capsules</a>
    <article class="panel capsule-detail">
      <div id="capsule-poster" class="poster-preview" aria-label="Capsule poster"></div>
      <p id="capsule-creator">Created by: You (accounts coming soon)</p>
      <p id="capsule-unlock-time" class="countdown"></p>
      <section id="calendar-reminder" aria-label="Unlock reminder" hidden>
        <a id="download-calendar" class="button-link" aria-describedby="calendar-reminder-hint">Download calendar reminder</a>
        <p id="calendar-reminder-hint">Open the downloaded file in your calendar app to add a reminder for the unlock time.</p>
      </section>
    </article>
  </main>
</body>
</html>
