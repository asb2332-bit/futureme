services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: futureme
      POSTGRES_PASSWORD: futureme
      POSTGRES_DB: futureme_development
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futureme -d futureme_development"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
